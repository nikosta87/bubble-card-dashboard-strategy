name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed HACS bundle
        run: git diff --exit-code -- dist/bubble-card-dashboard-strategy.js

      - name: Create release for new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi

          echo "Creating release $TAG"

          git log -1 --pretty=format:'%b' "$GITHUB_SHA" > /tmp/release-notes.md

          if [ -s /tmp/release-notes.md ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
